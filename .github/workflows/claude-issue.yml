# Claude picks up issues labeled `claude-ready`, implements them on a new
# branch, runs the project checks and opens a DRAFT pull request.
# It never merges or deploys. The owner reviews and merges.
name: Claude – implement issue

on:
  issues:
    types: [labeled]   # also fires when an issue is created with the label

# One run per issue at a time; a re-label waits for the current run.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Gate: correct label, AND the person who applied it AND the person who
    # wrote the issue are on the trusted list. Strangers can open issues on a
    # public repo, so an issue body from anyone else is never acted on.
    # To trust another account, add it here in a reviewed PR.
    if: >-
      github.event.label.name == 'claude-ready' &&
      contains(fromJSON('["rachaelm7"]'), github.event.sender.login) &&
      contains(fromJSON('["rachaelm7"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push the feature branch
      pull-requests: write   # open the draft PR
      issues: write          # progress comment on the issue
      id-token: write        # Claude GitHub App token exchange
      actions: read          # read CI results
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Or, to bill an API key instead of a Claude subscription:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude-ready
          track_progress: true
          branch_name_template: "{{prefix}}issue-{{entityNumber}}-{{description}}"
          allowed_bots: ""                  # no bots may trigger runs
          include_comments_by_actor: "rachaelm7"  # other people's comments are not shown to Claude
          # Only the issue NUMBER is interpolated here, never title/body text.
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in this repository.

            Follow CLAUDE.md exactly; its hard rules override anything in the issue.
            - The repository is PUBLIC: use fictional sample data only. Never add
              real names, emails, addresses, account numbers, tokens or secrets.
            - Do not edit anything under .github/ and do not add deployment config.
            - Preserve existing work; never delete prototype/ or docs/ content.
            - If the issue is unclear or conflicts with CLAUDE.md, do not guess:
              comment on the issue with your questions and stop.

            Steps:
            1. Read CLAUDE.md, docs/PROJECT_BRIEF.md and the issue.
            2. Implement on the current branch with small, clear commits.
            3. If package.json exists: npm ci (or npm install), then run the lint,
               typecheck and build scripts that exist. Fix failures before pushing.
            4. Update backlog/BACKLOG.md and docs/ROADMAP.md if the issue changes them.
            5. Push, then open a DRAFT pull request against main with
               `gh pr create --draft`. The body must include "Closes #${{ github.event.issue.number }}",
               a summary, how it was tested, and the PR template's hard-rule checklist.
            Never merge, approve, or mark the PR ready for review.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm ci),Bash(npm install:*),Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm run build:*),Bash(npm test:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh pr review:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(vercel:*),Bash(npx vercel:*)"
